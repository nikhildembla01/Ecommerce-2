<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwala</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: credit ribbon, blue store header, category strip, then one app area that swaps views (home, product, cart, checkout, orders, wishlist). */
:root {
  --bg: #f1f4f8; --surface: #ffffff; --fg: #12202e; --muted: #5b6b7b; --line: #d9e1e9;
  --accent: #2547d0; --accent-fg: #ffffff;
  --head: #2547d0; --head-fg: #ffffff;
  --sale: #f2a516; --sale-fg: #3a2600; --buy: #e8590c; --buy-fg: #ffffff;
  --green: #1a8f3c; --green-fg: #ffffff; --red: #c0352b;
  --ribbon: #12202e; --ribbon-fg: #eef3f8; --tile: #e6ecf8;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141c; --surface: #152130; --fg: #e8eef5; --muted: #98a8b8; --line: #263648;
    --accent: #8aa0ff; --accent-fg: #0b1330; --head: #1a2c75; --head-fg: #ffffff;
    --sale: #f2b53c; --sale-fg: #2a1b00; --buy: #ff7a33; --buy-fg: #1d0b00;
    --green: #3fc474; --green-fg: #06210f; --red: #ff8b80;
    --ribbon: #070b10; --ribbon-fg: #e8eef5; --tile: #1b2b42; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141c; --surface: #152130; --fg: #e8eef5; --muted: #98a8b8; --line: #263648;
  --accent: #8aa0ff; --accent-fg: #0b1330; --head: #1a2c75; --head-fg: #ffffff;
  --sale: #f2b53c; --sale-fg: #2a1b00; --buy: #ff7a33; --buy-fg: #1d0b00;
  --green: #3fc474; --green-fg: #06210f; --red: #ff8b80;
  --ribbon: #070b10; --ribbon-fg: #e8eef5; --tile: #1b2b42; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }

/* credit ribbon */
.ribbon { background: var(--ribbon); color: var(--ribbon-fg); }
.ribbon .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 12px; }
.logo-card { flex: none; background: #fff; border-radius: 12px; padding: 6px 10px; line-height: 0; }
.logo-card img { display: block; height: 76px; width: auto; max-width: 100%; }
.student { margin-left: auto; font-family: var(--font-mono); font-size: 13px; display: grid; gap: 2px; text-align: right; }
.student b { font-weight: 500; font-size: 16px; }
.student span { opacity: .75; }

/* header */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--head); color: var(--head-fg); }
.head .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { all: unset; cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; white-space: nowrap; }
.brand i { font-style: normal; color: var(--sale); }
.sbox { position: relative; flex: 1; min-width: 0; }
.sbox input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 0; background: #fff; color: #12202e; }
.sug { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; z-index: 25; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.sug button { display: block; width: 100%; text-align: left; padding: 9px 14px; border: 0; background: transparent; }
.sug button:hover, .sug button:focus-visible { background: var(--tile); }
.hbtn { border: 0; background: transparent; color: var(--head-fg); padding: 8px 10px; border-radius: 8px; font-weight: 600; white-space: nowrap; position: relative; }
.hbtn:hover { background: rgba(255,255,255,.14); }
.hbtn .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 5px; border-radius: 999px; background: var(--sale); color: var(--sale-fg); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; min-width: 170px; overflow: hidden; z-index: 25; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; border: 0; background: transparent; }
.menu button:hover { background: var(--tile); }
.acct { position: relative; }

/* categories */
.cats { background: var(--surface); border-bottom: 1px solid var(--line); }
.cats .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 8px; }
.cat { flex: none; display: grid; justify-items: center; gap: 4px; border: 0; background: transparent; padding: 4px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; }
.cat .ic { position: relative; width: 52px; height: 40px; border-radius: 10px; overflow: hidden; }
.cat .ic svg { width: 100%; height: 100%; display: block; }
.cat[aria-pressed="true"] { color: var(--accent); }
.cat[aria-pressed="true"] .ic { outline: 2px solid var(--accent); }

main { padding-block: 16px 40px; display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

/* banner */
.banner { position: relative; border-radius: 14px; overflow: hidden; color: #fff; min-height: 190px; margin-bottom: 16px; }
.slide { display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; gap: 8px; padding: 26px 30px; min-height: 190px; }
.slide h2 { font-size: clamp(26px, 4.6vw, 44px); font-weight: 800; letter-spacing: -.02em; }
.slide p { margin: 8px 0 14px; opacity: .92; }
.slide .shop { display: inline-block; background: #fff; color: #12202e; border: 0; border-radius: 8px; padding: 9px 18px; font-weight: 700; }
.slide .spic { max-width: 240px; justify-self: center; width: 100%; }
.slide .spic svg { width: 100%; display: block; }
.dots { position: absolute; bottom: 10px; left: 30px; display: flex; gap: 6px; }
.dots button { width: 9px; height: 9px; border-radius: 50%; border: 0; background: rgba(255,255,255,.5); padding: 0; }
.dots button[aria-current="true"] { background: #fff; width: 22px; border-radius: 6px; }

/* deals */
.deals { padding: 14px; margin-bottom: 16px; }
.deals header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.deals h2 { font-size: 22px; }
.cd { font-family: var(--font-mono); color: var(--red); font-weight: 500; }
.row-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.mini-card { flex: none; width: 150px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 0; overflow: hidden; }
.mini-card .pic2 { aspect-ratio: 4/3; overflow: hidden; }
.mini-card .pic2 svg { width: 100%; display: block; }
.mini-card div.t { padding: 8px 10px; font-size: 13px; }
.mini-card b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-card .off { color: var(--green); font-weight: 600; }

/* home layout */
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
.side { padding: 14px; display: grid; gap: 16px; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
.side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; font-family: var(--font-body); font-weight: 600; }
.side label.opt { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
.side input[type=range] { width: 100%; accent-color: var(--accent); }
.linkbtn { border: 0; background: transparent; color: var(--accent); text-decoration: underline; padding: 0; }
.fbtn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 14px; }
.toolbar .grow { flex: 1; min-width: 160px; }
.toolbar select { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.art { position: relative; aspect-ratio: 4 / 3; overflow: hidden; cursor: pointer; }
.pic { position: absolute; inset: 0; }
.pic svg { width: 100%; height: auto; display: block; }
.badge { position: absolute; top: 10px; left: 10px; background: var(--sale); color: var(--sale-fg); font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.heart { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #8a97a6; font-size: 18px; line-height: 1; }
.heart[aria-pressed="true"] { color: #e5383b; }
.info { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.brandn { font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.info h3 { font-size: 16px; font-weight: 700; cursor: pointer; }
.rate { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.pill { background: var(--green); color: var(--green-fg); font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
.price { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.mrp { color: var(--muted); text-decoration: line-through; font-size: 13px; }
.offp { color: var(--green); font-weight: 600; font-size: 13px; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.add { background: var(--sale); color: var(--sale-fg); }
.btn.buy { background: var(--buy); color: var(--buy-fg); }
.btn.ghost { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: default; }
.card .btn { margin-top: 8px; padding: 9px; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }

/* product page */
.pv { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px; padding: 18px; }
.pv .art { border-radius: 12px; cursor: default; }
.pv .btns { display: flex; gap: 10px; margin-top: 12px; }
.pv .btns .btn { flex: 1; padding: 14px; }
.pv h1 { font-size: clamp(22px, 3.4vw, 32px); margin: 4px 0 8px; }
.pv .price { font-size: 30px; }
.offers { margin: 14px 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.offers li::before { content: "%"; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 8px; border-radius: 50%; background: var(--green); color: var(--green-fg); font-size: 11px; font-weight: 700; }
.pin { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.pin input { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); width: 150px; }
table.spec { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
table.spec td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.spec td:first-child { color: var(--muted); width: 38%; }
.sect { padding: 16px; margin-top: 16px; }
.sect h2 { font-size: 20px; margin-bottom: 10px; }

/* cart and checkout */
.two { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.line { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; padding: 16px; border-bottom: 1px solid var(--line); }
.line .th { border-radius: 10px; overflow: hidden; aspect-ratio: 4/3; position: relative; }
.line h3 { font-size: 16px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
.qty button { border: 0; background: transparent; width: 32px; height: 32px; font-size: 17px; }
.qty span { min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 8px; }
.placebar { padding: 14px 16px; display: flex; justify-content: flex-end; }
.pbox { padding: 0; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
.pbox h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 14px 16px; border-bottom: 1px solid var(--line); font-family: var(--font-body); font-weight: 600; }
.pbox .rows { padding: 14px 16px; display: grid; gap: 10px; font-variant-numeric: tabular-nums; }
.pbox .r { display: flex; justify-content: space-between; gap: 10px; }
.pbox .r.t { border-top: 1px dashed var(--line); padding-top: 12px; font-weight: 700; font-size: 17px; }
.pbox .g { color: var(--green); }
.pbox .sv { padding: 12px 16px; border-top: 1px solid var(--line); color: var(--green); font-weight: 600; }
.cpn { padding: 12px 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.cpn .f { display: flex; gap: 8px; }
.cpn input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; font-family: var(--font-mono); }
.msg { font-size: 13px; min-height: 18px; }
.msg.bad { color: var(--red); } .msg.good { color: var(--green); }

.step { margin-bottom: 12px; overflow: hidden; }
.step > header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface); }
.step.on > header { background: var(--head); color: var(--head-fg); }
.step .no { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; background: var(--tile); color: var(--accent); font-weight: 700; font-size: 13px; flex: none; }
.step.on .no { background: #fff; color: var(--head); }
.step .ttl { font-weight: 700; flex: 1; min-width: 0; }
.step .body { padding: 16px; display: grid; gap: 12px; }
.addr { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.addr input { margin-top: 4px; accent-color: var(--accent); }
.addr.sel { border-color: var(--accent); background: var(--tile); }
form.f { display: grid; gap: 10px; }
form.f label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
form.f input, form.f textarea, form.f select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.paytabs { display: grid; gap: 8px; }
.paytab { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.paytab.sel { border-color: var(--accent); background: var(--tile); }
.paytab input { accent-color: var(--accent); }
.payform { padding: 4px 2px 0 30px; display: grid; gap: 10px; }
.hint { font-size: 12.5px; color: var(--muted); }

/* orders */
.order { margin-bottom: 14px; overflow: hidden; }
.order > header { display: flex; flex-wrap: wrap; gap: 6px 20px; justify-content: space-between; padding: 12px 16px; background: var(--tile); font-size: 13.5px; }
.order .it { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.order .it .th { width: 64px; flex: none; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; position: relative; }
.track { display: flex; padding: 16px; gap: 0; list-style: none; margin: 0; overflow-x: auto; }
.track li { flex: 1 0 90px; text-align: center; font-size: 12.5px; color: var(--muted); position: relative; padding-top: 22px; }
.track li::before { content: ""; position: absolute; top: 6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--line); z-index: 1; }
.track li::after { content: ""; position: absolute; top: 11px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.track li:first-child::after { display: none; }
.track li.done { color: var(--fg); }
.track li.done::before, .track li.done::after { background: var(--green); }
.ostat { padding: 0 16px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tag-c { color: var(--red); font-weight: 700; }
.success { padding: 34px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.tick { width: 60px; height: 60px; border-radius: 50%; background: var(--green); color: var(--green-fg); display: grid; place-items: center; font-size: 30px; }
.oid { font-family: var(--font-mono); background: var(--bg); padding: 4px 10px; border-radius: 6px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(5,10,18,.55); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; width: min(420px, 100%); max-height: calc(100% - 16px); overflow-y: auto; padding: 22px; display: grid; gap: 12px; }
.modal h2 { font-size: 24px; }
.tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 10px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.spin { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; vertical-align: -3px; margin-right: 8px; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: sp .8s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } } .card { transition: box-shadow .15s ease; } .card:hover { box-shadow: 0 8px 22px rgba(10,20,40,.14); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }

.foot { background: var(--ribbon); color: var(--ribbon-fg); }
.foot .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; display: none; }
  .side.show { display: grid; }
  .fbtn { display: inline-block; }
  .two { grid-template-columns: 1fr; }
  .pbox { position: static; }
  .pv { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .student { margin-left: 0; text-align: left; flex: 1 1 100%; }
  .logo-card img { height: 60px; }
  .head .wrap { flex-wrap: wrap; }
  .sbox { order: 5; flex: 1 1 100%; }
  .hbtn .lbl { display: none; }
  .brand { font-size: 21px; margin-right: auto; }
  .slide { grid-template-columns: 1fr; padding: 20px 18px 34px; }
  .slide .spic { display: none; }
  .dots { left: 18px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .info h3 { font-size: 14.5px; }
  .price { font-size: 17px; }
  .line { grid-template-columns: 76px minmax(0, 1fr); }
  .f2 { grid-template-columns: 1fr; }
}
@media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }
</style>

<style>body{margin:0}</style>
</head>
<body>

/* checkout */
function stepHead(n, title, on, right) { return '<header><span class="no">' + n + '</span><span class="ttl">' + title + '</span>' + (right || "") + '</header>'; }
function checkout() {
  var u = user(), its = items();
  if (!u) return '<div class="panel empty">Login to continue.<br><button type="button" class="btn primary" data-act="login">Login</button></div>';
  if (!its.length) return cartView();
  var ad = u.addr || [];
  var h = '<div class="two"><div>';
  h += '<div class="panel step">' + stepHead(1, "Login", false, '<span class="muted">' + esc(u.name) + ' · ' + esc(session) + '</span>') + '</div>';
  /* address */
  h += '<div class="panel step' + (S.step === 2 ? " on" : "") + '">' + stepHead(2, "Delivery address", S.step === 2, S.step > 2 ? '<button type="button" class="btn ghost" data-act="chstep" data-id="2">Change</button>' : "");
  if (S.step === 2) {
    h += '<div class="body">' + ad.map(function (a, i) { return '<label class="addr' + (S.addrIx === i && !S.addNew ? " sel" : "") + '"><input type="radio" name="ad" data-ch="addr" value="' + i + '"' + (S.addrIx === i && !S.addNew ? " checked" : "") + '><span><b>' + esc(a.name) + '</b> ' + esc(a.phone) + '<br>' + esc(a.line) + ', ' + esc(a.city) + ' - ' + esc(a.pin) + '</span></label>'; }).join("");
    if (ad.length && !S.addNew) h += '<div><button type="button" class="btn buy" data-act="deliver">Deliver here</button> <button type="button" class="btn ghost" data-act="newaddr">Add a new address</button></div>';
    else h += '<form class="f" id="addrForm" novalidate><label for="a-name">Full name<input id="a-name" autocomplete="name" value="' + esc(u.name) + '"></label><div class="f2"><label for="a-phone">Mobile number<input id="a-phone" inputmode="numeric" maxlength="10" autocomplete="tel"></label><label for="a-pin">PIN code<input id="a-pin" inputmode="numeric" maxlength="6" autocomplete="postal-code"></label></div><label for="a-line">Address (house, street, area)<textarea id="a-line" rows="2" autocomplete="street-address"></textarea></label><label for="a-city">City<input id="a-city" autocomplete="address-level2"></label><div class="msg bad" id="aErr" role="alert"></div><div><button type="submit" class="btn buy">Save and deliver here</button>' + (ad.length ? ' <button type="button" class="btn ghost" data-act="canceladd">Cancel</button>' : '') + '</div></form>';
    h += '</div>';
  } else { var a0 = ad[S.addrIx]; h += '<div class="body muted">' + esc(a0.name) + ', ' + esc(a0.line) + ', ' + esc(a0.city) + ' - ' + esc(a0.pin) + '</div>'; }
  h += '</div>';
  /* summary */
  h += '<div class="panel step' + (S.step === 3 ? " on" : "") + '">' + stepHead(3, "Order summary", S.step === 3, S.step > 3 ? '<button type="button" class="btn ghost" data-act="chstep" data-id="3">Change</button>' : "");
  if (S.step === 3) h += its.map(function (a) { var x = byId(a[0]); return '<div class="line">' + thumb(x) + '<div><h3>' + x.n + '</h3><div class="muted">Qty ' + a[1] + ' · ' + inr(x.p * a[1]) + '</div></div></div>'; }).join("") + '<div class="placebar"><button type="button" class="btn buy" data-act="tostep" data-id="4">Continue</button></div>';
  h += '</div>';
  /* payment */
  var q = pricing();
  h += '<div class="panel step' + (S.step === 4 ? " on" : "") + '">' + stepHead(4, "Payment options", S.step === 4);
  if (S.step === 4) h += '<div class="body"><div class="paytabs">' + [["upi", "UPI"], ["card", "Credit / Debit card"], ["cod", "Cash on delivery"]].map(function (m) { return '<label class="paytab' + (S.pay === m[0] ? " sel" : "") + '"><input type="radio" name="pm" data-ch="pay" value="' + m[0] + '"' + (S.pay === m[0] ? " checked" : "") + '>' + m[1] + '</label>'; }).join("") + '</div><div id="payForm">' + payForm() + '</div>' +
    '<div class="msg bad" id="pErr" role="alert"></div><button type="button" class="btn buy" id="payBtn" data-act="pay"' + (S.paying ? " disabled" : "") + '>' + (S.paying ? '<span class="spin"></span>Processing payment' : (S.pay === "cod" ? "Place order" : "Pay " + inr(q.total))) + '</button></div>';
  h += '</div></div>' + pbox(false) + '</div>';
  return h;
}
function payForm() {
  if (S.pay === "upi") return '<div class="payform"><form class="f"><label for="upi">UPI ID<input id="upi" placeholder="name@bank" autocomplete="off"></label></form><div class="hint">Demo: any UPI ID like nikhil@okaxis works.</div></div>';
  if (S.pay === "card") return '<div class="payform"><form class="f"><label for="cno">Card number<input id="cno" inputmode="numeric" maxlength="23" placeholder="1234 5678 9012 3456" autocomplete="off"></label><div class="f2"><label for="cex">Expiry (MM/YY)<input id="cex" maxlength="5" placeholder="08/29" autocomplete="off"></label><label for="ccv">CVV<input id="ccv" inputmode="numeric" maxlength="4" type="password" autocomplete="off"></label></div><label for="cnm">Name on card<input id="cnm" autocomplete="off"></label></form><div class="hint">Demo: test card 4111 1111 1111 1111 with any future expiry. Card details are not saved.</div></div>';
  return '<div class="payform"><div class="hint">Pay in cash when the order arrives. No extra charge.</div></div>';
}
function luhn(s) { var sum = 0, alt = false; for (var i = s.length - 1; i >= 0; i--) { var d = +s[i]; if (alt) { d *= 2; if (d > 9) d -= 9; } sum += d; alt = !alt; } return sum % 10 === 0; }
function deliveryDate(pin) { var s = 0; String(pin).split("").forEach(function (c) { s += +c; }); var d = new Date(); d.setDate(d.getDate() + 2 + (s % 3)); return d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }); }

function payNow() {
  var err = $("pErr"), v = function (id) { return ($(id) ? $(id).value.trim() : ""); }, label = "Cash on delivery";
  if (S.pay === "upi") { if (!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v("upi"))) { err.textContent = "Enter a valid UPI ID, like name@bank."; return; } label = "UPI (" + v("upi") + ")"; }
  if (S.pay === "card") {
    var no = v("cno").replace(/\s/g, ""), ex = v("cex").match(/^(\d{2})\/(\d{2})$/);
    if (!/^\d{13,19}$/.test(no) || !luhn(no)) { err.textContent = "That card number is not valid."; return; }
    if (!ex || +ex[1] < 1 || +ex[1] > 12 || new Date(2000 + +ex[2], +ex[1], 0, 23, 59) < new Date()) { err.textContent = "Enter a valid expiry date in the future (MM/YY)."; return; }
    if (!/^\d{3,4}$/.test(v("ccv"))) { err.textContent = "Enter the 3 or 4 digit CVV."; return; }
    if (!v("cnm")) { err.textContent = "Enter the name on the card."; return; }
    label = "Card ending " + no.slice(-4);
  }
  err.textContent = ""; S.paying = true; render();
  setTimeout(function () {
    var q = pricing(), u = user(), a = u.addr[S.addrIx];
    var o = { id: "CW" + Date.now().toString(36).toUpperCase().slice(-7), email: session, at: Date.now(), total: q.total, pay: label, addr: a, canceled: false,
      items: items().map(function (t) { var x = byId(t[0]); return { id: x.id, n: x.n, p: x.p, q: t[1] }; }) };
    orders.unshift(o); sv("cw-orders", orders);
    if (S.buyNow) S.buyNow = null; else cart = {}; sv("cw-cart", cart);
    S.coupon = ""; S.paying = false; S.lastOrder = o.id; S.step = 2; headerUpdate(); go("success");
  }, 1500);
}

/* orders */
function stageOf(o) { return o.canceled ? -1 : Math.min(4, Math.floor((Date.now() - o.at) / STAGE_MS)); }
function ordersView() {
  if (!user()) return '<div class="panel empty">Login to see your orders.<br><button type="button" class="btn primary" data-act="login">Login</button></div>';
  var mine = orders.filter(function (o) { return o.email === session; });
  if (!mine.length) return '<div class="panel empty"><h2>No orders yet</h2><p>Your orders will show up here.</p><button type="button" class="btn primary" data-act="home">Start shopping</button></div>';
  return '<div class="panel toolbar"><b>My orders</b><span class="muted">Demo: status moves ahead about every 40 seconds.</span></div>' + mine.map(function (o) {
    var st = stageOf(o), d = new Date(o.at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
    return '<section class="panel order"><header><span>Order <b class="mono">' + o.id + '</b></span><span>Placed ' + d + '</span><span>Total <b>' + inr(o.total) + '</b></span><span>' + esc(o.pay) + '</span></header>' +
      o.items.map(function (i) { var x = byId(i.id); return '<div class="it">' + thumb(x) + '<div><b>' + esc(i.n) + '</b><div class="muted">Qty ' + i.q + ' · ' + inr(i.p) + '</div></div></div>'; }).join("") +
      (o.canceled ? '<div class="ostat"><span class="tag-c">Cancelled</span><button type="button" class="btn ghost" data-act="again" data-oid="' + o.id + '">Buy again</button></div>'
        : '<ol class="track">' + STAGES.map(function (s, i) { return '<li class="' + (i <= st ? "done" : "") + '">' + s + '</li>'; }).join("") + '</ol><div class="ostat"><span class="muted">Delivering to ' + esc(o.addr.name) + ', ' + esc(o.addr.city) + ' - ' + esc(o.addr.pin) + '</span><span>' + (st < 2 ? '<button type="button" class="btn ghost" data-act="cancel" data-oid="' + o.id + '">Cancel order</button> ' : '') + '<button type="button" class="btn ghost" data-act="again" data-oid="' + o.id + '">Buy again</button></span></div>') + '</section>';
  }).join("");
}
function successView() {
  var o = orders.filter(function (x) { return x.id === S.lastOrder; })[0];
  if (!o) return home();
  return '<div class="panel success"><div class="tick" aria-hidden="true">&#10003;</div><h2>Order placed</h2><div>Thank you, ' + esc(o.addr.name.split(" ")[0]) + '. Your order number is</div><div class="oid">' + o.id + '</div><div class="muted">Estimated delivery by ' + deliveryDate(o.addr.pin) + ' · ' + inr(o.total) + ' · ' + esc(o.pay) + '</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button type="button" class="btn primary" data-act="orders">Track order</button><button type="button" class="btn ghost" data-act="home">Continue shopping</button></div></div>';
}

var VIEWS = { home: home, product: product, cart: cartView, wishlist: wishView, checkout: checkout, orders: ordersView, success: successView };
function render() { headerUpdate(); app.innerHTML = VIEWS[S.view](); if (S.view === "home") { var s = $("sort"); if (s) s.value = S.sort; } tick(); }

/* auth */
function hash(s) {
  if (window.crypto && crypto.subtle && window.TextEncoder) return crypto.subtle.digest("SHA-256", new TextEncoder().encode("cw:" + s)).then(function (b) { return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join(""); });
  return Promise.resolve(btoa("cw:" + s));
}
function authModal() {
  var su = S.authTab === "signup";
  layer.innerHTML = '<div class="scrim" data-act="closem"><div class="modal" role="dialog" aria-modal="true" aria-label="Login"><h2>' + (su ? "Create account" : "Login") + '</h2><div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="' + !su + '" data-act="atab" data-t="login">Login</button><button type="button" role="tab" aria-selected="' + su + '" data-act="atab" data-t="signup">Sign up</button></div>' +
    '<form class="f" id="authForm" novalidate>' + (su ? '<label for="u-name">Full name<input id="u-name" autocomplete="name"></label>' : '') + '<label for="u-mail">Email<input id="u-mail" type="email" autocomplete="email"></label><label for="u-pass">Password (6 or more characters)<input id="u-pass" type="password" autocomplete="' + (su ? "new-password" : "current-password") + '"></label><div class="msg bad" id="uErr" role="alert"></div><button type="submit" class="btn buy block">' + (su ? "Create account" : "Login") + '</button></form><div class="hint">Demo store: accounts are saved only in this browser.</div></div></div>';
  var f = $(su ? "u-name" : "u-mail"); if (f) f.focus();

function startCheckout() {
  if (!user()) { S.after = "checkout"; S.authTab = "login"; authModal(); return; }
  S.step = 2; S.addNew = !(user().addr && user().addr.length); S.addrIx = 0; go("checkout");
}
function closeM() { layer.innerHTML = ""; }

/* events */
var ACT = {
  home: function () { S.buyNow = null; S.cat = "All"; S.q = ""; $("q").value = ""; go("home"); },
  cat: function (id, t) { S.cat = t.dataset.c; S.q = ""; $("q").value = ""; S.buyNow = null; go("home"); },
  open: function (id) { S.pid = id; S.pinMsg = ""; go("product"); },
  add: function (id) { cart[id] = (cart[id] || 0) + 1; sv("cw-cart", cart); headerUpdate(); toast(byId(id).n + " added to cart"); },
  buy: function (id) { S.buyNow = id; startCheckout(); },
  wish: function (id) { var i = wish.indexOf(id); if (i > -1) wish.splice(i, 1); else { wish.push(id); toast("Added to wishlist"); } sv("cw-wish", wish); render(); },
  inc: function (id) { cart[id]++; sv("cw-cart", cart); render(); },
  dec: function (id) { cart[id]--; if (cart[id] < 1) delete cart[id]; sv("cw-cart", cart); render(); },
  rm: function (id) { delete cart[id]; sv("cw-cart", cart); render(); },
  later: function (id) { delete cart[id]; if (wish.indexOf(id) < 0) wish.push(id); sv("cw-cart", cart); sv("cw-wish", wish); toast("Saved to wishlist"); render(); },
  cart: function () { S.buyNow = null; go("cart"); },
  wishlist: function () { go("wishlist"); },
  orders: function () { go("orders"); },
  login: function () { S.authTab = "login"; authModal(); },
  logout: function () { session = null; sv("cw-session", null); S.buyNow = null; toast("Logged out"); go("home"); },
  menu: function () { var m = $("menu"); m.hidden = !m.hidden; },
  atab: function (id, t) { S.authTab = t.dataset.t; authModal(); },
  closem: function (id, t, e) { if (e.target === t) closeM(); },
  slide: function (id) { S.slide = id; var b = $("banner"); if (b) b.outerHTML = bannerHtml(); },
  tf: function () { S.showF = !S.showF; $("side").classList.toggle("show", S.showF); },
  clearf: function () { S.maxP = 7000; S.minR = 0; S.minD = 0; S.brands = []; render(); },
  coupon: function () { var c = $("cpIn").value.trim().toUpperCase(); if (c && !COUPONS[c]) { S.coupon = ""; render(); $("cpMsg").textContent = "That coupon is not valid."; return; } S.coupon = c; render(); },
  usecp: function (id, t) { S.coupon = t.dataset.code; render(); },
  pin: function () { var p = $("pin").value.trim(); S.pinMsg = /^[1-9]\d{5}$/.test(p) ? "Delivery by " + deliveryDate(p) + ". Free if your order is above ₹999." : "Enter a valid 6-digit PIN code."; $("pinMsg").textContent = S.pinMsg; $("pinMsg").className = "msg " + (S.pinMsg.indexOf("by") > -1 ? "good" : "bad"); },
  checkout: function () { S.buyNow = null; startCheckout(); },
  deliver: function () { S.step = 3; render(); },
  newaddr: function () { S.addNew = true; render(); },
  canceladd: function () { S.addNew = false; render(); },
  chstep: function (id) { S.step = id; render(); },
  tostep: function (id) { S.step = id; render(); },
  pay: payNow,
  cancel: function (id, t) { orders.forEach(function (o) { if (o.id === t.dataset.oid) o.canceled = true; }); sv("cw-orders", orders); toast("Order cancelled"); render(); },
  again: function (id, t) { orders.forEach(function (o) { if (o.id === t.dataset.oid) o.items.forEach(function (i) { cart[i.id] = (cart[i.id] || 0) + i.q; }); }); sv("cw-cart", cart); toast("Items added to cart"); S.buyNow = null; go("cart"); }
};
document.addEventListener("click", function (e) {
  var m = $("menu"); if (m && !m.hidden && !e.target.closest(".acct")) m.hidden = true;
  var sg = $("sug"); if (sg && !sg.hidden && !e.target.closest(".sbox")) sg.hidden = true;
  var t = e.target.closest("[data-act]"); if (!t) return;
  var f = ACT[t.dataset.act]; if (f) f(+t.dataset.id, t, e);
});
document.addEventListener("change", function (e) {
  var t = e.target, k = t.dataset.ch; if (!k) return;
  if (k === "sort") { S.sort = t.value; renderGrid(); }
  if (k === "minr") { S.minR = +t.value; renderGrid(); }
  if (k === "mind") { S.minD = +t.value; renderGrid(); }
  if (k === "brand") { var i = S.brands.indexOf(t.value); if (t.checked && i < 0) S.brands.push(t.value); if (!t.checked && i > -1) S.brands.splice(i, 1); renderGrid(); }
  if (k === "addr") { S.addrIx = +t.value; render(); }
  if (k === "pay") { S.pay = t.value; render(); }
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.dataset.ch === "maxp") { S.maxP = +t.value; $("mpv").textContent = inr(S.maxP); renderGrid(); }
  if (t.id === "q") {
    var v = t.value.trim(), sg = $("sug");
    if (v.length < 2) { sg.hidden = true; return; }
    var m = P.filter(function (x) { return (x.n + " " + x.b).toLowerCase().indexOf(v.toLowerCase()) > -1; }).slice(0, 6);
    sg.innerHTML = m.map(function (x) { return '<button type="button" data-act="open" data-id="' + x.id + '">' + x.n + ' <span class="muted">in ' + x.c + '</span></button>'; }).join("") || '<button type="button" disabled>No suggestions</button>';
    sg.hidden = false;
  }
  if (t.id === "cno") { t.value = t.value.replace(/[^\d]/g, "").replace(/(\d{4})(?=\d)/g, "$1 ").slice(0, 23); }
  if (t.id === "cex") { var d = t.value.replace(/[^\d]/g, "").slice(0, 4); t.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; }
});
$("q").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { S.q = e.target.value.trim(); S.cat = "All"; $("sug").hidden = true; S.buyNow = null; go("home"); }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeM(); var sg = $("sug"); if (sg) sg.hidden = true; } });
document.addEventListener("submit", function (e) {
  var f = e.target; e.preventDefault();
  if (f.id === "authForm") {
    var mail = $("u-mail").value.trim().toLowerCase(), pw = $("u-pass").value, er = $("uErr"), su = S.authTab === "signup";
    if (!/^\S+@\S+\.\S+$/.test(mail)) { er.textContent = "Enter a valid email address."; return; }
    if (pw.length < 6) { er.textContent = "Password must have at least 6 characters."; return; }
    if (su && !$("u-name").value.trim()) { er.textContent = "Enter your name."; return; }
    hash(pw).then(function (h) {
      if (su) {
        if (users[mail]) { er.textContent = "This email already has an account. Try logging in."; return; }
        users[mail] = { name: $("u-name").value.trim(), h: h, addr: [] };
      } else if (!users[mail] || users[mail].h !== h) { er.textContent = "Email or password is wrong."; return; }
      sv("cw-users", users); session = mail; sv("cw-session", mail); closeM(); headerUpdate(); toast("Welcome, " + users[mail].name.split(" ")[0]);
      if (S.after === "checkout") { S.after = null; startCheckout(); } else render();
    });
  }
  if (f.id === "addrForm") {
    var g = function (id) { return $(id).value.trim(); }, ae = $("aErr");
    if (!g("a-name") || !g("a-line") || !g("a-city")) { ae.textContent = "Fill in your name, address and city."; return; }
    if (!/^[6-9]\d{9}$/.test(g("a-phone"))) { ae.textContent = "Enter a 10-digit Indian mobile number."; return; }
    if (!/^[1-9]\d{5}$/.test(g("a-pin"))) { ae.textContent = "Enter a valid 6-digit PIN code."; return; }
    var u = user(); u.addr = u.addr || []; u.addr.push({ name: g("a-name"), phone: g("a-phone"), pin: g("a-pin"), line: g("a-line"), city: g("a-city") });
    sv("cw-users", users); S.addrIx = u.addr.length - 1; S.addNew = false; S.step = 3; render();
  }
});

/* timers */
function tick() {
  var el = $("cd"); if (!el) return;
  var n = new Date(), e = new Date(n); e.setHours(24, 0, 0, 0);
  var s = Math.floor((e - n) / 1000), p = function (v) { return String(v).padStart(2, "0"); };
  el.textContent = p(Math.floor(s / 3600)) + ":" + p(Math.floor(s % 3600 / 60)) + ":" + p(s % 60);
}
setInterval(tick, 1000);
setInterval(function () { if (S.view === "orders") render(); }, 5000);
if (!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) {
  setInterval(function () { if (S.view === "home" && !S.q && S.cat === "All" && $("banner")) { S.slide = (S.slide + 1) % SLIDES.length; $("banner").outerHTML = bannerHtml(); } }, 5000);
}
render();
})();
</script>

</body>
</html>
